syntax = "proto3";

package presence;
option go_package = "smsgateway/contract/golang/sms";

message SmsRequest {
    string idempotency_key = 1;
    int64 message_id = 2;
    string source_number = 3;
    string receptor_number = 4;
    string content = 5;
    int32 attempt = 6;
    uint64 operator_id = 7;
    uint64 user_id = 8;
}